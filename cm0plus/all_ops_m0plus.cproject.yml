  # Squeeze the whole-operator-surface image: no exceptions/RTTI/unwind tables
  # (ExecuTorch is exception-free by design) and LTO on top of -Os. Build under
  # the Release build-type (optimize: size); -O0/-Og images do not fit the
  # 3 MB flash partition.
  misc:
    - for-compiler: GCC
      C: [-flto=auto, -fno-unwind-tables, -fno-asynchronous-unwind-tables]
      CPP: [-flto=auto, -fno-unwind-tables, -fno-asynchronous-unwind-tables,
            -fno-exceptions, -fno-rtti]
      Link: [-flto=auto, -Os]

  linker:
    - script: ./xmc7200d_x8384_cm0plus.ld
      for-compiler: GCC

  groups:
    - group: App
      files:
        - file: ../common/main.cpp
        # This context's OWN M0+ (SCALAR-sized) models.
        - file: ./embedded_models.cpp
        - file: ./embedded_models_blob.S
        - file: ../common/et_pal_override.cpp
        # No ALL_OPS_ETHOS_U define -> compiles to the no-op ethos_setup().
        - file: ../common/ethos_setup.cpp
    - group: Board
      files:
        - file: ./board_t2g_cm0p.c
        - file: ../board/retarget_stdio.c

  output:
    type:
      - elf
      - hex
      - map
