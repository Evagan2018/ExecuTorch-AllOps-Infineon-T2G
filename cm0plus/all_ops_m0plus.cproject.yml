# TRAVEO T2G (KIT_T2G-B-H_LITE) Cortex-M0+ port of the all-ops CPU test.
# Armv6-M has neither MVE nor the DSP extension, so every CMSIS-NN kernel
# takes its pure-C SCALAR path. The CM0+ is also the T2G's boot core: this
# image configures the device, runs its own test over the KitProg3 UART and
# then releases Cortex-M7 core 0 (board_all_ops_done in board_t2g_cm0p.c),
# whose image runs the same test down the DSP path.

project:
  device: :Cortex-M0p

  packs:
    - pack: PyTorch::ExecuTorch

  define:
    # ET_LOG disabled to keep the thumbv6 image lean (matches the other
    # physical-target ports of this test).
    - ET_LOG_ENABLED: 0
    # The static pools default to a generous FVP/DDR provisioning (see
    # common/main.cpp). The T2G's 1 MB SRAM is shared by both test images, so
    # size them down; measured high-water marks ("MemReport:") are ~11 KB.
    - METHOD_POOL_KB: 128
    - TEMP_POOL_KB: 32
    - META_POOL_KB: 16
    - META_TEMP_POOL_KB: 8

  # Resolve project-local headers (random_device_shim.h) for the -include in
  # the ExecuTorch pack components.
  add-path:
    - .
    - ../common
    - ../board/Device_Configurator/GeneratedSource

  # add-path is C/C++ only; the assembler needs add-path-asm so
  # embedded_models_blob.S resolves its relative `.incbin "models/..."` paths.
  # This context embeds its OWN M0+ (SCALAR-sized scratch) models.
  add-path-asm:
    - .

  generators:
    options:
      - generator: InfineonDeviceConfigurator
        path: ../board/Device_Configurator
        name: Board

  components:
    - component: ARM::CMSIS:CORE
    - component: Infineon::Device:Startup
    - component: Infineon::Device:Peripheral Driver Library:PDL
    - component: Infineon::Board Support&KIT_T2G-B-H_LITE:Board Setup
    - component: Infineon::Device Configurator:Device Configurator
    - component: ARM::CMSIS-Compiler:CORE
    - component: ARM::CMSIS-Compiler:STDOUT:Custom
    - component: ARM::CMSIS-Compiler:STDERR:Custom
    - component: Machine Learning:ExecuTorch:Runtime
    - component: Machine Learning:ExecuTorch:Kernel Utils
    - component: Machine Learning:ExecuTorch:Kernel Registration
    - component: ARM::CMSIS:NN Lib
    - component: Machine Learning:ExecuTorch Operators:Portable adaptive_avg_pool2d
